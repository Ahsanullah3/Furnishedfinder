name: Scrape FurnishedFinder

on:
  workflow_dispatch:
    inputs:
      batch_index:
        description: "Batch index (0-based)"
        required: false
        default: "0"
      auto_chain:
        description: "Auto-trigger next batch"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
  schedule:
    - cron: "0 6 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: ff-scrape-${{ github.event.inputs.batch_index || '0' }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start FlareSolverr
        run: |
          docker run -d --name flaresolverr -p 8191:8191 flaresolverr/flaresolverr
          echo "Waiting for FlareSolverr..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8191/health | grep -q '"ok"'; then
              echo "FlareSolverr ready"
              break
            fi
            sleep 2
          done

      - name: Run scraper
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          WORKSHEET_NAME: Sheet1
          BATCH_SIZE: "100"
          CONCURRENCY: "5"
          BATCH_INDEX: ${{ github.event.inputs.batch_index || '0' }}
          AUTO_CHAIN: ${{ github.event.inputs.auto_chain || 'true' }}
          USE_FLARESOLVERR: "true"
          FLARESOLVERR_URL: "http://localhost:8191/v1"
          LOG_LEVEL: INFO
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_WORKFLOW_FILE: scrape.yml
        run: python scraper.py
