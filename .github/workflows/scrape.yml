name: Scrape FurnishedFinder

on:
  workflow_dispatch:
    inputs:
      batch_index:
        description: "Batch index (0-based)"
        required: false
        default: "0"
      auto_chain:
        description: "Auto-trigger next batch"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
  schedule:
    - cron: "0 6 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: ff-scrape-${{ github.event.inputs.batch_index || '0' }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Chrome and dependencies
        run: |
          sudo apt-get update
          # Ubuntu 24.04 renamed libasound2 → libasound2t64
          sudo apt-get install -y \
            wget \
            libnss3 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            libdrm2 \
            libgbm1 \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libgtk-3-0t64 \
            libatk1.0-0t64 \
            libcups2t64 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxkbcommon0 \
            libpango-1.0-0 \
            libcairo2
          # Install Chrome directly from Google (more reliable than apt package)
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          WORKSHEET_NAME: Sheet1
          BATCH_SIZE: "100"
          CONCURRENCY: "2"
          BATCH_INDEX: ${{ github.event.inputs.batch_index || '0' }}
          AUTO_CHAIN: ${{ github.event.inputs.auto_chain || 'true' }}
          HEADLESS: "true"
          LOG_LEVEL: INFO
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_WORKFLOW_FILE: scrape.yml
        run: python scraper.py
